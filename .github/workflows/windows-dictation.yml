name: Build Dictee (Windows)

on:
  push:
    paths:
      - "windows-dictation/**"
      - ".github/workflows/windows-dictation.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-dictation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --windowed --name Dictee
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-binaries onnxruntime --collect-data onnxruntime
          --hidden-import pystray._win32
          run_dictee.py
      - name: Smoke test imports
        run: python -c "import dictee.app, dictee.transcriber; print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: Dictee-windows
          path: windows-dictation/dist/Dictee
